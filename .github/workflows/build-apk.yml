name: Build Android Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x Digital-Clock-APK-Ready/Digital-Clock-APK-Ready/gradlew

      - name: Build APK
        working-directory: Digital-Clock-APK-Ready/Digital-Clock-APK-Ready
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital-Clock-APK
          path: Digital-Clock-APK-Ready/Digital-Clock-APK-Ready/app/build/outputs/apk/debug/app-debug.apk
