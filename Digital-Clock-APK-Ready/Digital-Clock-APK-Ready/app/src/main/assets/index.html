<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>Digital Clock</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;background:#0d1117;color:#fff}
    body{font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .clock{text-align:center;width:100%;padding:24px}
    .time{font-size:clamp(58px,15vw,180px);font-weight:700;letter-spacing:2px;line-height:1;white-space:nowrap}
    .date{margin-top:24px;font-size:clamp(15px,3vw,25px);color:#8993a3}
    @media(max-width:600px){
      .clock{padding:16px}
      .time{font-size:16vw;letter-spacing:0}
      .date{margin-top:20px;font-size:4.5vw}
    }
  </style>
</head>
<body>
  <main class="clock">
    <div class="time" id="time">7:54:12</div>
    <div class="date" id="date">Loading...</div>
  </main>
<script>
function updateClock(){
  const now=new Date();
  let h=now.getHours()%12; if(h===0) h=12;
  const m=String(now.getMinutes()).padStart(2,"0");
  const s=String(now.getSeconds()).padStart(2,"0");
  const ap=now.getHours()>=12?"PM":"AM";
  document.getElementById("time").textContent=`${h}:${m}:${s} ${ap}`;
  document.getElementById("date").textContent=now.toLocaleDateString("en-IN",{
    weekday:"long",day:"numeric",month:"long",year:"numeric"
  });
}
updateClock();
setInterval(updateClock,1000);
</script>
</body>
</html>
